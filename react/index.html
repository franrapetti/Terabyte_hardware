<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link id="site-favicon" rel="icon" type="image/png" href="/src/assets/favicon_oscuro.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Aplicar la preferencia antes de cargar React evita un destello del otro tema.
      let theme = 'dark'
      try { theme = localStorage.getItem('terrabyte-theme') === 'light' ? 'light' : 'dark' } catch {}
      document.documentElement.dataset.theme = theme
      document.documentElement.style.colorScheme = theme
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <title>TerraByte</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
