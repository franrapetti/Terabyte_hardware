<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraByte</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="./home.html">
          <img class="nav-imagen" src="../assets/Logo.png" alt="Logo" />
        </a>
        <button
          class="nav-button"
          onclick="window.location.href = './home.html'"
        >
          <label name="home" class="nav-label">Home</label>
        </button>
        <button
          class="nav-button"
          onclick="window.location.href = './aboutus.html'"
        >
          <label name="about" class="nav-label">About us</label>
        </button>
        <button
          class="nav-button"
          onclick="window.location.href = './products.html'"
        >
          <label name="products" class="nav-label">Products</label>
        </button>
        <button
          class="nav-button"
          onclick="window.location.href = './services.html'"
        >
          <label name="services" class="nav-label">Services</label>
        </button>
        <button class="nav-button">
          <input type="search" placeholder="Buscar" />
        </button>
        <a class="nav-button" onclick="window.location.href = './login.html'">
          <label name="login" class="nav-label">Log In</label>
        </a>
      </nav>
    </header>

    <main>
      <h1>Iniciar sesión</h1>
      <form>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required /><br />

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required /><br />

        <button type="submit">Ingresar</button>
      </form>
    </main>

    <footer>
      <label name="home" class="footer-text"
        >Copyright © 2026 TerraByte Team. All rights reserved.</label
      >
      <a class="footer-text" href="" target="_blank">Privacy Policy</a>
      <a class="footer-text" href="" target="_blank">Terms of Use</a>
      <a class="footer-text" href="" target="_blank">Sales and Refunds</a>
      <a class="footer-text" href="" target="_blank">Legal</a>
      <a class="footer-text" href="" target="_blank">Site Map</a>
    </footer>
  </body>
</html>
